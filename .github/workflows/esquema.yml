name: Esquema

# Migra una base vacía y publica el esquema SQL completo como anotación (gzip+base64).
on:
  workflow_dispatch:
  push:
    paths: ['database/migrations/**', '.github/workflows/esquema.yml']

permissions:
  contents: read

jobs:
  esquema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: agrolink }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: agrolink
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'mbstring, pdo, pdo_pgsql, pgsql, bcmath, intl', coverage: none }
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - name: Volcado
        run: |
          pg_dump -h 127.0.0.1 -U postgres -d agrolink --schema-only --no-owner --no-privileges > esquema.sql
          wc -c esquema.sql
          gzip -9 -c esquema.sql | base64 -w0 > esquema.b64
          wc -c esquema.b64
          echo "::notice title=ESQUEMA_B64::$(cat esquema.b64)"
