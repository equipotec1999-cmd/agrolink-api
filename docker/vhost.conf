<VirtualHost *:${PORT}>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    <Directory ${APACHE_DOCUMENT_ROOT}>
        AllowOverride All
        Require all granted
    </Directory>
    # JSON comprimido: el feed y los chats pesan ~5-8 veces menos por datos móviles
    # (la app los descomprime sola; dart:io manda Accept-Encoding: gzip).
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json text/html text/plain
    </IfModule>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
